name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-test:
    name: Rust ${{ matrix.toolchain }} / ${{ matrix.features }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.88.0", stable]
        features: [default, all-features, no-default-features]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Test workspace
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.features }}" in
            default)
              cargo test --workspace --all-targets --locked
              ;;
            all-features)
              cargo test --workspace --all-targets --all-features --locked
              ;;
            no-default-features)
              cargo test --workspace --all-targets --no-default-features --locked
              ;;
            *)
              printf 'unknown feature set: %s\n' "${{ matrix.features }}" >&2
              exit 1
              ;;
          esac

  rust-quality:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/copilotkit-acp-demo
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run type-check
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build

  security:
    name: Security audits
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install frontend dependencies
        working-directory: examples/copilotkit-acp-demo
        run: bun install --frozen-lockfile
      - name: Report high frontend advisories (non-blocking)
        working-directory: examples/copilotkit-acp-demo
        continue-on-error: true
        run: bun audit --audit-level=high
      - name: Block critical frontend advisories
        working-directory: examples/copilotkit-acp-demo
        run: bun audit --audit-level=critical

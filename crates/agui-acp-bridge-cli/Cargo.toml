[package]
name = "agui-acp-bridge-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "agui-acp-bridge"
path = "src/main.rs"

[features]
default = ["unstable_session_usage"]
unstable_session_model = [
    "agui-acp-bridge-core/unstable_session_model",
    "agui-acp-bridge-server/unstable_session_model",
]
unstable_session_usage = [
    "agui-acp-bridge-core/unstable_session_usage",
    "agui-acp-bridge-server/unstable_session_usage",
]

[dependencies]
agui-acp-bridge-core = { path = "../agui-acp-bridge-core", default-features = false }
agui-acp-bridge-policy = { path = "../agui-acp-bridge-policy" }
agui-acp-bridge-server = { path = "../agui-acp-bridge-server", default-features = false }
axum = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

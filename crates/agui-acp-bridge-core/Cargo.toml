[package]
name = "agui-acp-bridge-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["unstable_session_usage"]
# Compatibility feature for the legacy `SessionModelState` discovery mirror.
# ACP 2.0 exposes the stable v1 schema directly; model changes still use the
# stable `session/set_config_option` path in the bridge.
unstable_session_model = []
# Compatibility feature for the ACP `SessionUpdate::UsageUpdate` translation.
# ACP 2.0 exposes the stable v1 usage update without a draft feature; it is
# translated to a CUSTOM `agent:usage_update` event for the frontend.
unstable_session_usage = []

[dependencies]
agent-client-protocol = { workspace = true }
agui-rs-core = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
dashmap = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
agui-acp-bridge-policy = { path = "../agui-acp-bridge-policy" }
